<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>画像編集</title>
    
    <!-- PWA / Mobile App Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="画像編集">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Upload View: Mode Menu (Edit / Convert) + Image Upload -->
        <div id="upload-view" class="view active">
            <div class="upload-content">
                <input type="file" id="image-upload" accept="image/*" class="file-input" multiple>

                <div class="upload-stack">
                    <!-- 2 Menus: 編集 / 変換 -->
                    <div class="mode-menu-grid" id="upload-mode-menu" role="tablist" aria-label="機能メニュー">
                        <button type="button" class="mode-menu-card active" data-mode="edit" role="tab" aria-selected="true">
                            <span class="mode-menu-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 20h9"></path>
                                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                                </svg>
                            </span>
                            <span class="mode-menu-text">
                                <span class="mode-menu-title">編集</span>
                                <span class="mode-menu-desc">切り抜き・調整</span>
                            </span>
                        </button>

                        <button type="button" class="mode-menu-card" data-mode="convert" role="tab" aria-selected="false">
                            <span class="mode-menu-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="17 1 21 5 17 9"></polyline>
                                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                                    <polyline points="7 23 3 19 7 15"></polyline>
                                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                                </svg>
                            </span>
                            <span class="mode-menu-text">
                                <span class="mode-menu-title">変換</span>
                                <span class="mode-menu-desc">形式をまとめて変換</span>
                            </span>
                        </button>
                    </div>

                    <!-- Main Image Upload Trigger -->
                    <button type="button" class="upload-minimal-btn" id="btn-trigger-upload">
                        <span class="upload-icon-circle" id="upload-icon-circle">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </span>
                        <span class="upload-minimal-label" id="upload-action-label">編集する画像を選択</span>
                        <span class="upload-minimal-hint" id="upload-action-hint">複数枚選択OK・ドロップ対応</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Editor View -->
        <div id="editor-view" class="view">
            <div class="editor-header glass">
                <button type="button" class="btn icon-btn" id="btn-back" aria-label="戻る" title="戻る">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                
                <div class="header-center">
                    <div class="progress-nav" id="progress-nav" style="display: none;">
                        <button type="button" class="progress-nav-btn" id="btn-prev-image" aria-label="前の画像">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <span class="progress-pill-text" id="progress-indicator">1 / 1</span>
                        <button type="button" class="progress-nav-btn" id="btn-next-edit" aria-label="次の画像">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="header-right">
                    <button type="button" class="btn icon-btn icon-btn-sm" id="btn-undo" aria-label="1つ前に戻す" title="1つ前に戻す (Ctrl+Z)" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 14 4 9l5-5"></path>
                            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"></path>
                        </svg>
                    </button>
                    <button type="button" class="btn icon-btn icon-btn-sm" id="btn-redo" aria-label="やり直す" title="やり直す (Ctrl+Y)" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m15 14 5-5-5-5"></path>
                            <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"></path>
                        </svg>
                    </button>
                    <button type="button" class="btn primary-btn btn-process-pill" id="btn-process" aria-label="完了">
                        <span id="btn-process-label" class="btn-process-label" style="display: none;">次へ</span>
                        <svg id="icon-process-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <svg id="icon-process-next" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Cropper & Live Preview Workspace -->
            <div class="cropper-container" id="cropper-container">
                <canvas id="image-workspace"></canvas>
                
                <div id="crop-overlay" class="crop-overlay">
                    <div id="crop-box" class="crop-box">
                        <div class="crop-grid-h"></div>
                        <div class="crop-grid-v"></div>
                        <!-- Corner Handles -->
                        <div class="handle handle-nw" data-dir="nw"></div>
                        <div class="handle handle-ne" data-dir="ne"></div>
                        <div class="handle handle-sw" data-dir="sw"></div>
                        <div class="handle handle-se" data-dir="se"></div>
                        <!-- Edge Handles -->
                        <div class="handle handle-n" data-dir="n"></div>
                        <div class="handle handle-s" data-dir="s"></div>
                        <div class="handle handle-e" data-dir="e"></div>
                        <div class="handle handle-w" data-dir="w"></div>
                    </div>
                </div>

                <!-- Floating Workspace Icon Buttons -->
                <div class="workspace-floating-bar">
                    <button type="button" class="floating-pill-btn" id="btn-toggle-zoom" aria-label="全体表示に切替" title="全体表示 / 切り抜き拡大を切替">
                        <svg id="icon-zoom-out" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <polyline points="4 14 10 14 10 20"></polyline>
                            <polyline points="20 10 14 10 14 4"></polyline>
                            <line x1="14" y1="10" x2="21" y2="3"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                        <svg id="icon-zoom-in" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <polyline points="9 21 3 21 3 15"></polyline>
                            <line x1="21" y1="3" x2="14" y2="10"></line>
                            <line x1="3" y1="21" x2="10" y2="14"></line>
                        </svg>
                        <span id="zoom-toggle-label">拡大</span>
                    </button>
                    <button type="button" class="floating-icon-btn" id="btn-compare" aria-label="元画像と比較" title="長押しで元画像と比較">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Bottom Dock: Contextual Bar + One-Finger Scrollable Icon Menu -->
            <div class="editor-bottom-dock glass">
                
                <!-- Contextual Active Control Panel -->
                <div id="active-control-panel" class="active-control-panel" aria-hidden="true">
                    
                    <!-- 1. Adjustment Slider Sub-Panel -->
                    <div id="panel-slider" class="sub-panel">
                        <div class="panel-header">
                            <div class="panel-title-group">
                                <span id="active-tool-name" class="panel-title">明るさ</span>
                                <span id="active-tool-val" class="value-badge">0</span>
                            </div>
                            <div class="panel-actions">
                                <button type="button" class="btn icon-close-btn" id="btn-close-slider" aria-label="閉じる">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="slider-row">
                            <button type="button" class="btn-step" id="btn-step-minus" aria-label="1減らす">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                            <div class="slider-wrapper">
                                <div class="slider-track-bg">
                                    <div id="slider-fill" class="slider-fill"></div>
                                    <div id="slider-center-tick" class="slider-center-tick"></div>
                                </div>
                                <input type="range" id="active-slider" min="-100" max="100" value="0" step="1" class="slider">
                            </div>
                            <button type="button" class="btn-step" id="btn-step-plus" aria-label="1増やす">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- 2. Aspect Ratio Sub-Panel -->
                    <div id="panel-aspect" class="sub-panel" style="display: none;">
                        <div class="panel-header">
                            <span class="panel-title">比率</span>
                            <button type="button" class="btn icon-close-btn" id="btn-close-aspect" aria-label="閉じる">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                        </div>
                        <div class="aspect-pills" id="aspect-pills">
                            <button type="button" class="aspect-pill active" data-ratio="0.8">4:5</button>
                            <button type="button" class="aspect-pill" data-ratio="1">1:1</button>
                            <button type="button" class="aspect-pill" data-ratio="1.7777778">16:9</button>
                            <button type="button" class="aspect-pill" data-ratio="0.5625">9:16</button>
                            <button type="button" class="aspect-pill" data-ratio="1.3333333">4:3</button>
                            <button type="button" class="aspect-pill" data-ratio="0.75">3:4</button>
                            <button type="button" class="aspect-pill" data-ratio="original">元比率</button>
                            <button type="button" class="aspect-pill" data-ratio="free">自由</button>
                        </div>
                    </div>

                    <!-- 3. Rotate / Flip / Straighten Sub-Panel -->
                    <div id="panel-transform" class="sub-panel" style="display: none;">
                        <div class="panel-header">
                            <div class="panel-title-group">
                                <span class="panel-title">回転・反転</span>
                                <span id="straighten-val" class="value-badge">0°</span>
                            </div>
                            <div class="panel-actions">
                                <button type="button" class="btn icon-close-btn" id="btn-close-transform" aria-label="閉じる">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="transform-actions-row">
                            <button type="button" class="transform-btn" id="btn-rotate-ccw" aria-label="左へ90°回転">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2.5 2v6h6M2.66 15.57a10 10 0 1 0 .57-8.38"/>
                                </svg>
                            </button>
                            <button type="button" class="transform-btn" id="btn-rotate-cw" aria-label="右へ90°回転">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/>
                                </svg>
                            </button>
                            <button type="button" class="transform-btn" id="btn-flip-h" aria-label="左右反転">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m3 7 5 5-5 5V7"/><path d="m21 7-5 5 5 5V7"/><path d="M12 20v2"/><path d="M12 14v2"/><path d="M12 8v2"/><path d="M12 2v2"/>
                                </svg>
                            </button>
                            <button type="button" class="transform-btn" id="btn-flip-v" aria-label="上下反転">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m7 3 5 5 5-5H7"/><path d="m7 21 5-5 5 5H7"/><path d="M20 12h2"/><path d="M14 12h2"/><path d="M8 12h2"/><path d="M2 12h2"/>
                                </svg>
                            </button>
                        </div>
                        <div class="slider-row">
                            <button type="button" class="btn-step" id="btn-straighten-minus" aria-label="0.5度減らす">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                            <div class="slider-wrapper">
                                <div class="slider-track-bg">
                                    <div id="straighten-fill" class="slider-fill"></div>
                                    <div class="slider-center-tick"></div>
                                </div>
                                <input type="range" id="straighten-slider" min="-45" max="45" value="0" step="0.5" class="slider">
                            </div>
                            <button type="button" class="btn-step" id="btn-straighten-plus" aria-label="0.5度増やす">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- 4. Preset Filters Sub-Panel -->
                    <div id="panel-filters" class="sub-panel" style="display: none;">
                        <div class="panel-header">
                            <div class="panel-title-group">
                                <span class="panel-title">フィルター</span>
                                <span id="filter-strength-val" class="value-badge">100%</span>
                            </div>
                            <button type="button" class="btn icon-close-btn" id="btn-close-filters" aria-label="閉じる">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>
                        </div>
                        <div class="filter-pills" id="filter-pills">
                            <button type="button" class="filter-pill active" data-filter="none">なし</button>
                            <button type="button" class="filter-pill" data-filter="vivid">クリア</button>
                            <button type="button" class="filter-pill" data-filter="warm">ウォーム</button>
                            <button type="button" class="filter-pill" data-filter="cool">クール</button>
                            <button type="button" class="filter-pill" data-filter="dramatic">ドラマ</button>
                            <button type="button" class="filter-pill" data-filter="film">フィルム</button>
                            <button type="button" class="filter-pill" data-filter="mono">モノクロ</button>
                            <button type="button" class="filter-pill" data-filter="sepia">セピア</button>
                        </div>
                        <div class="slider-row" id="filter-slider-wrapper" style="display: none;">
                            <button type="button" class="btn-step" id="btn-filter-minus" aria-label="1%減らす">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                            <div class="slider-wrapper">
                                <div class="slider-track-bg">
                                    <div id="filter-fill" class="slider-fill"></div>
                                </div>
                                <input type="range" id="filter-strength-slider" min="0" max="100" value="100" step="1" class="slider">
                            </div>
                            <button type="button" class="btn-step" id="btn-filter-plus" aria-label="1%増やす">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Bottom Tool Menu Bar (Direct 1-finger touch/drag scroll) -->
                <div class="tool-menu-bar" id="tool-menu-bar" role="toolbar" aria-label="編集ツール">
                    <button type="button" class="tool-item" data-tool="aspect">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
                                <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">比率</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="transform">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                                <polyline points="21 3 21 8 16 8"></polyline>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">回転</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="filters">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">フィルター</span>
                    </button>

                    <div class="tool-divider"></div>

                    <button type="button" class="tool-item" data-tool="brightness">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">明るさ</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="exposure">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                                <line x1="8" y1="12" x2="16" y2="12"></line>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">露出</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="contrast">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M12 2a10 10 0 0 0 0 20z" fill="currentColor"></path>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">コントラスト</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="highlights">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"></path>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">ハイライト</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="shadows">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <path d="M12 3v18"></path>
                                <path d="M12 8l6 6"></path>
                                <path d="M12 12l5 5"></path>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">シャドウ</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="saturation">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">彩度</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="warmth">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">色温度</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="tint">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"></circle>
                                <circle cx="12" cy="9" r="3"></circle>
                                <circle cx="9.5" cy="14" r="3"></circle>
                                <circle cx="14.5" cy="14" r="3"></circle>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">色合い</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="sharpness">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="12 3 3 20 21 20 12 3"></polygon>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">シャープ</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="fade">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                                <path d="M3 15h18"></path>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">フェード</span>
                    </button>

                    <button type="button" class="tool-item" data-tool="vignette">
                        <div class="tool-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="2" width="20" height="20" rx="4"></rect>
                                <circle cx="12" cy="12" r="6"></circle>
                            </svg>
                            <span class="tool-dot"></span>
                        </div>
                        <span class="tool-label">ビネット</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- Complete & Save View (Shown after all images finish editing) -->
        <div id="complete-view" class="view">
            <div class="editor-header glass">
                <button type="button" class="btn icon-btn" id="btn-complete-back" aria-label="編集に戻る" title="編集に戻る">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div class="progress-pill" id="complete-title-pill">編集完了</div>
                <button type="button" class="btn icon-btn" id="btn-restart-top" aria-label="新しく選ぶ" title="別の画像を選ぶ">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                </button>
            </div>

            <div class="complete-body">
                <!-- Single Image Preview -->
                <div id="single-result-wrap" class="single-result-wrap" style="display: none;">
                    <div class="result-image-container">
                        <img id="single-result-image" src="" alt="">
                    </div>
                </div>

                <!-- Multi-Image Batch Gallery -->
                <div id="batch-gallery" class="batch-gallery" style="display: none;"></div>
            </div>

            <!-- Format & Save Dock -->
            <div class="complete-save-dock glass">
                <div class="export-row">
                    <span class="export-label">形式</span>
                    <div class="format-pills" id="format-pills">
                        <button type="button" class="format-pill active" data-format="image/jpeg">JPEG</button>
                        <button type="button" class="format-pill" data-format="image/png">PNG</button>
                        <button type="button" class="format-pill" data-format="image/webp">WebP</button>
                    </div>
                    <span class="export-size-badge" id="export-total-size"></span>
                </div>

                <div class="complete-bottom-bar">
                    <button type="button" class="btn btn-save-main" id="btn-download-all">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="btn-download-all-label">保存</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Convert View (Pure Format Conversion for Multiple Images) -->
        <div id="convert-view" class="view">
            <div class="editor-header glass">
                <button type="button" class="btn icon-btn" id="btn-convert-back" aria-label="戻る" title="戻る">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div class="progress-pill" id="convert-header-pill">画像変換</div>
                <button type="button" class="btn convert-add-pill" id="btn-convert-add" aria-label="画像を追加" title="画像を追加">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>追加</span>
                </button>
            </div>

            <div class="convert-body" id="convert-body">
                <div id="convert-list" class="convert-list"></div>

                <div id="convert-empty-state" class="convert-empty-state" style="display: none;">
                    <p class="convert-empty-text">画像が選択されていません</p>
                    <button type="button" class="btn primary-btn" id="btn-convert-empty-pick">画像を選択</button>
                </div>
            </div>

            <div class="complete-save-dock convert-dock glass">
                <div id="convert-progress-wrap" class="convert-progress-wrap" style="display: none;">
                    <div class="convert-progress-meta">
                        <span id="convert-progress-label">変換中...</span>
                        <span id="convert-progress-count">0 / 0</span>
                    </div>
                    <div class="convert-progress-track">
                        <div id="convert-progress-bar" class="convert-progress-bar"></div>
                    </div>
                </div>

                <div class="export-row">
                    <span class="export-label">変換先</span>
                    <div class="format-pills" id="convert-format-pills">
                        <button type="button" class="format-pill active" data-format="image/jpeg">JPEG</button>
                        <button type="button" class="format-pill" data-format="image/png">PNG</button>
                        <button type="button" class="format-pill" data-format="image/webp">WebP</button>
                    </div>
                    <span class="export-size-badge" id="convert-summary-badge"></span>
                </div>

                <div class="complete-bottom-bar">
                    <button type="button" class="btn primary-btn convert-action-btn" id="btn-convert-start">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                        <span id="btn-convert-start-label">JPEGに変換する</span>
                    </button>

                    <button type="button" class="btn convert-download-btn" id="btn-convert-download-all" style="display: none;">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="btn-convert-download-label">ダウンロード</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Lightbox Preview Modal (for inspecting individual image in multi-image gallery) -->
        <div id="lightbox-modal" class="lightbox-modal" aria-hidden="true">
            <div class="lightbox-header">
                <span class="lightbox-counter" id="lightbox-counter"></span>
                <button type="button" class="btn icon-btn lightbox-close-btn" id="btn-lightbox-close" aria-label="閉じる">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="lightbox-body" id="lightbox-body">
                <img id="lightbox-image" src="" alt="">
            </div>
            <div class="lightbox-footer">
                <button type="button" class="btn icon-btn lightbox-nav-btn" id="btn-lightbox-prev" aria-label="前の画像">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button type="button" class="btn outline-btn" id="btn-lightbox-edit">編集し直す</button>
                <button type="button" class="btn icon-btn lightbox-nav-btn" id="btn-lightbox-next" aria-label="次の画像">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Render Loading Overlay -->
        <div id="render-loading" class="render-loading" aria-hidden="true">
            <div class="render-loading-card">
                <div class="spinner"></div>
                <span id="render-loading-text">画像を仕上げています...</span>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast" role="status" aria-live="polite"></div>

    </div>

    <script src="main.js"></script>
</body>
</html>

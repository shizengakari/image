<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0e11">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>InstaCrop</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- 1. Upload View -->
        <div id="upload-view" class="view active">
            <header class="header-simple">
                <span class="brand-title">InstaCrop (4:5)</span>
            </header>

            <main class="upload-content">
                <div class="upload-card" id="upload-card">
                    <div class="upload-icon-wrapper">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <path d="m21 15-5-5L5 21"></path>
                        </svg>
                    </div>
                    
                    <input type="file" id="image-upload" accept="image/*" class="file-input" multiple>
                    <button class="btn primary-btn btn-large" id="btn-trigger-upload">画像を選択</button>
                </div>
            </main>
        </div>

        <!-- 2. Editor View -->
        <div id="editor-view" class="view">
            <!-- Header -->
            <header class="editor-header">
                <button class="btn icon-btn" id="btn-back" aria-label="戻る">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="header-center">
                    <span class="progress-pill" id="progress-indicator">1 / 1</span>
                </div>
                <div class="header-actions">
                    <button class="btn icon-btn" id="btn-rotate" aria-label="90度回転" title="90°回転">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                        </svg>
                    </button>
                    <button class="btn text-btn" id="btn-compare" aria-label="比較">
                        <span>比較</span>
                    </button>
                </div>
            </header>
            
            <!-- Cropper Workspace -->
            <div class="cropper-container" id="cropper-container">
                <img id="image-workspace" src="" alt="編集用画像" draggable="false">
                
                <!-- Crop Overlay & 4:5 Box -->
                <div id="crop-overlay" class="crop-overlay">
                    <div id="crop-box" class="crop-box">
                        <!-- 3x3 Grid Lines -->
                        <div class="grid-lines">
                            <span class="grid-h grid-h1"></span>
                            <span class="grid-h grid-h2"></span>
                            <span class="grid-v grid-v1"></span>
                            <span class="grid-v grid-v2"></span>
                        </div>
                        
                        <!-- 4 Corner Handles for zooming / resizing -->
                        <div class="handle handle-nw" data-dir="nw"></div>
                        <div class="handle handle-ne" data-dir="ne"></div>
                        <div class="handle handle-sw" data-dir="sw"></div>
                        <div class="handle handle-se" data-dir="se"></div>
                    </div>
                </div>

                <!-- Compare Badge -->
                <div class="compare-badge" id="compare-badge">元画像を表示中</div>
            </div>

            <!-- Bottom Controls (Large & Clear) -->
            <footer class="controls-panel">
                <!-- Large Slider Area -->
                <div class="slider-panel">
                    <div class="slider-header-row">
                        <span class="slider-main-label" id="current-slider-label">明るさ</span>
                        <div class="slider-badge-group">
                            <button class="btn-reset" id="btn-reset-slider">リセット</button>
                            <span id="current-slider-val" class="value-badge-large">0</span>
                        </div>
                    </div>
                    <div class="slider-track-container">
                        <input type="range" id="active-slider" min="0" max="200" value="100" class="slider slider-large">
                    </div>
                </div>

                <!-- Clear 3 Tool Tabs -->
                <div class="tool-tabs" id="tool-tabs">
                    <button class="tool-tab active" data-tool="brightness">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <span>明るさ</span>
                    </button>
                    <button class="tool-tab" data-tool="contrast">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 2a10 10 0 0 0 0 20z"></path>
                        </svg>
                        <span>コントラスト</span>
                    </button>
                    <button class="tool-tab" data-tool="saturation">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                        </svg>
                        <span>彩度</span>
                    </button>
                </div>

                <!-- Bottom Action Bar (Large Buttons) -->
                <div class="bottom-action-bar">
                    <button class="btn secondary-btn" id="btn-editor-cancel">最初から</button>
                    <button class="btn primary-btn btn-confirm-large" id="btn-process">
                        <span>書き出し</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </footer>
        </div>

        <!-- 3. Result View -->
        <div id="result-view" class="view">
            <header class="editor-header">
                <button class="btn icon-btn" id="btn-result-back" aria-label="戻る">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <div class="header-center">
                    <span class="progress-pill">完成画像 (4:5)</span>
                </div>
                <div style="width: 40px;"></div>
            </header>
            
            <main class="result-content">
                <div class="result-image-wrapper">
                    <img id="result-image" src="" alt="完成画像">
                </div>

                <div class="save-actions-group">
                    <button class="btn share-btn" id="btn-share-image">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                            <polyline points="16 6 12 2 8 6"></polyline>
                            <line x1="12" y1="2" x2="12" y2="15"></line>
                        </svg>
                        <span>画像を保存 / 共有</span>
                    </button>

                    <button class="btn download-btn" id="btn-download-image">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>端末にダウンロード</span>
                    </button>
                </div>

                <p class="longpress-tip">画像を長押しして「写真に追加」でも保存できます</p>

                <div class="result-footer">
                    <button class="btn primary-btn btn-large" id="btn-next-image">次の写真へ</button>
                </div>
            </main>
        </div>

        <!-- 4. Complete View -->
        <div id="complete-view" class="view">
            <main class="complete-content">
                <div class="success-icon-badge">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
                <h1 class="title">保存完了！</h1>
                <p class="subtitle">すべての画像の処理が完了しました。</p>
                <button class="btn primary-btn btn-large" id="btn-restart" style="margin-top: 24px;">画像を選択</button>
            </main>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
